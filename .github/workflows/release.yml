name: Test and release Docker image
on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Test helpers without any playbook
        run: python3 -m unittest discover -s tests -v
      # The default image must build without the playbook repository: its address here cannot be reached.
      - name: Build the generic image
        run: docker build --build-arg PLAYBOOK_REPOSITORY=https://playbook.invalid/none.git -t t3-boat:test .
      - name: Smoke-test clean and attached installations
        run: bash tests/smoke-image.sh t3-boat:test generic
      - name: Verify optional Claude installation
        run: docker run --rm --entrypoint sh t3-boat:test -ec 'install-claude && claude --version'
      - name: Test helpers against agent-playbook
        run: sh scripts/fetch-playbook playbook && python3 -m unittest discover -s tests -v
      - name: Build and smoke-test the optional bundled image
        run: |
          docker build --build-arg BUNDLE_PLAYBOOK=1 -t t3-boat:bundled .
          bash tests/smoke-image.sh t3-boat:bundled bundled
      - name: Export tested image for release
        if: startsWith(github.ref, 'refs/tags/')
        run: docker save t3-boat:test | zstd -T0 -3 -o image.tar.zst
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: tested-${{ matrix.arch }}
          path: image.tar.zst
          compression-level: 0
          retention-days: 1

  publish:
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-*
      - name: Validate release coordinates
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REPOSITORY" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9_.-]*$ ]]
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish the tested images under one version tag
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          skopeo --version
          authfile="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          expected=()
          for arch in amd64 arm64; do
            # Stage the archive saved after this platform's tests. The dir: layout keeps
            # its manifest and image config byte for byte, so the digest names the
            # tested image, and only the layers are compressed for the registry.
            zstd -dq "tested-$arch/image.tar.zst" -o "$arch.tar"
            config=$(tar -xOf "$arch.tar" manifest.json |
              jq -er 'if length == 1 then .[0].Config else error("expected one image") end')
            config=${config##*/}
            config=sha256:${config%.json}
            [[ "$config" =~ ^sha256:[0-9a-f]{64}$ ]]
            skopeo copy --quiet --dest-compress "docker-archive:$arch.tar" "dir:staged-$arch"
            rm "$arch.tar"
            jq -e --arg config "$config" '.config.digest == $config' "staged-$arch/manifest.json" >/dev/null
            jq -e --arg arch "$arch" '.os == "linux" and .architecture == $arch' \
              "staged-$arch/${config#sha256:}" >/dev/null
            digest=sha256:$(sha256sum < "staged-$arch/manifest.json" | cut -d' ' -f1)
            # Push by digest only: no per-platform tag is created in the repository.
            skopeo copy --preserve-digests --dest-authfile "$authfile" \
              "dir:staged-$arch" "docker://$REPOSITORY@$digest"
            expected+=("$digest linux/$arch")
          done
          docker buildx imagetools create --tag "$REPOSITORY:$version" \
            "$REPOSITORY@${expected[0]%% *}" "$REPOSITORY@${expected[1]%% *}"
          # The version tag must list exactly the two tested images.
          published=$(docker buildx imagetools inspect --raw "$REPOSITORY:$version" |
            jq -r '.manifests[] | "\(.digest) \(.platform.os)/\(.platform.architecture)"')
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "$published")
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          printf 'Docker image for Linux AMD64 and ARM64.\n\n```sh\ndocker pull %s:%s\n```\n\n[Quick start](https://github.com/%s/blob/%s/README.md#quick-start)\n' \
            "$REPOSITORY" "${RELEASE_TAG#v}" "$GITHUB_REPOSITORY" "$RELEASE_TAG" > release-notes.md
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TAG" --notes-file release-notes.md
