name: Test and release Docker image
on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Test helpers
        run: python3 -m unittest discover -s tests -v
      - run: docker build -t t3-boat:test .
      - run: bash tests/smoke-image.sh t3-boat:test
      - name: Verify optional Claude installation
        run: docker run --rm --entrypoint sh t3-boat:test -ec 'install-claude && claude --version'
      - name: Export tested image for release
        if: startsWith(github.ref, 'refs/tags/')
        run: docker save t3-boat:test | zstd -T0 -3 -o image.tar.zst
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: tested-${{ matrix.arch }}
          path: image.tar.zst
          compression-level: 0
          retention-days: 1

  publish:
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-*
      - name: Validate release coordinates
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REPOSITORY" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9_.-]*$ ]]
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish the tested binaries and multi-platform tag
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          sources=()
          for arch in amd64 arm64; do
            zstd -dc "tested-$arch/image.tar.zst" | docker load
            test "$(docker image inspect --format '{{.Architecture}}' t3-boat:test)" = "$arch"
            tag="$REPOSITORY:$version-$arch"
            docker tag t3-boat:test "$tag"
            docker push "$tag"
            digest=$(docker image inspect "$tag" --format '{{json .RepoDigests}}' |
              jq -er --arg repo "$REPOSITORY" '.[] | select(startswith($repo + "@") or startswith("docker.io/" + $repo + "@")) | split("@")[1]')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("$REPOSITORY@$digest")
            docker image rm t3-boat:test "$tag"
          done
          docker buildx imagetools create --tag "$REPOSITORY:$version" "${sources[@]}"
          echo "$REPOSITORY:$version" > docker-image.txt
      - name: Attach the exact pull reference to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            printf 'Run this on the server, then choose a profile in the README.\n\n```sh\nexport IMAGE=%s\n```\n' \
              "$(cat docker-image.txt)" > release-notes.md
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" docker-image.txt --clobber
